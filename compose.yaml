services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: murmur
    volumes:
      - murmur-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur -d murmur"]
      interval: 5s
      timeout: 3s
      retries: 5
  server:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_URL: postgres://murmur:${POSTGRES_PASSWORD:?}@db:5432/murmur?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  murmur-pgdata:
